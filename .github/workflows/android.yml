name: Android bootstrap validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/source-commit.txt
      - name: Approved branding validation
        run: python3 scripts/validate_branding.py
      - name: Validate exact-package installed-state boundary
        run: python3 scripts/validate_android_installed_state_observation.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Lint
        run: gradle :app:lintDebug
      - name: Assemble development APK
        run: gradle :app:assembleDebug
      - name: Verify development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum "$APK" | tee build-evidence/app-debug.apk.sha256

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee build-evidence/app-debug.badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee build-evidence/app-debug.signing.txt

          grep -Fq "package: name='com.goreecloud.appstore.dev' versionCode='3' versionName='0.1.2-dev'" build-evidence/app-debug.badging.txt
          grep -Fq "application-label:'GoreeCloud App Store Dev'" build-evidence/app-debug.badging.txt
          grep -Fiq "certificate SHA-256 digest: 38d543bbc137dbf4e7a299ff2d2dd06555a5c20d110a9ada4de5e9e0d9055145" build-evidence/app-debug.signing.txt
      - name: Upload development APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-app-store-development-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-evidence/source-commit.txt
            build-evidence/app-debug.apk.sha256
            build-evidence/app-debug.badging.txt
            build-evidence/app-debug.signing.txt
          if-no-files-found: error
          retention-days: 14
