name: Android development validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p build-evidence
          printf '%s\n' "$ACTUAL_SHA" | tee build-evidence/source-commit.txt
      - name: Validate approved branding
        run: python3 scripts/validate_branding.py | tee build-evidence/branding.txt
      - name: Validate GLAZE UI source mapping
        run: python3 scripts/validate_glaze_ui_adoption.py | tee build-evidence/glaze-ui-adoption.txt
      - name: Validate installed-state observation boundary
        run: python3 scripts/validate_android_installed_state_observation.py | tee build-evidence/installed-state-observation.txt
      - name: Validate release-evidence gate
        run: python3 scripts/validate_release_evidence_gate.py | tee build-evidence/release-evidence-gate.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Compile native acceptance tests
        run: gradle :app:assembleDebugAndroidTest
      - name: Lint
        run: gradle :app:lintDebug
      - name: Assemble development APK
        run: gradle :app:assembleDebug
      - name: Verify development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee build-evidence/app-debug.apk.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee build-evidence/app-debug.badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee build-evidence/app-debug.signing.txt
          grep -Fq "package: name='com.goreecloud.appstore.dev' versionCode='6' versionName='0.1.5-dev'" build-evidence/app-debug.badging.txt
          grep -Fq "application-label:'GoreeCloud App Store Dev'" build-evidence/app-debug.badging.txt
          grep -Fiq "certificate SHA-256 digest: 38d543bbc137dbf4e7a299ff2d2dd06555a5c20d110a9ada4de5e9e0d9055145" build-evidence/app-debug.signing.txt
      - name: Upload development evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-app-store-development-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            contracts/glaze-ui-adoption.json
            build-evidence/source-commit.txt
            build-evidence/branding.txt
            build-evidence/glaze-ui-adoption.txt
            build-evidence/installed-state-observation.txt
            build-evidence/release-evidence-gate.txt
            build-evidence/app-debug.apk.sha256
            build-evidence/app-debug.badging.txt
            build-evidence/app-debug.signing.txt
          if-no-files-found: error
          retention-days: 14
