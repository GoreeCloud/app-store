name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and unit tests
        run: |
          python3 scripts/validate_catalog.py
          PYTHONPATH=.:linux python3 -m unittest discover -s tests -v
          python3 -m compileall -q linux scripts tests

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native Android debug APK (CI validation only)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle -p android :app:assembleDebug --no-daemon
