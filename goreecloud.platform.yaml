      - contracts/web-distribution.json
      - scripts/validate_glaze_ui_adoption.py
      - scripts/validate_glaze_ui_v1_4.py
    notes: Android, Linux, and Web source mappings target current Stable GLAZE UI V1.4 / 1.4.0 at verified Stable revision 84cb3db4884042f0fa25ed6d475a127fb110f596, with V1.3 / 1.3.0 retained as the immediate rollback baseline. V1.4 inherits the V1.3 neutral structural foundation while App Store optical behavior is local, bounded, accessibility-subordinate, and environmental-memory-free. Prior V1.1 and V1.3 rendered evidence remains historical provenance and does not automatically transfer to V1.4. Fresh V1.4 consumer-local rendered and supported-form-factor revalidation remains pending; human/manual/physical-device/subjective optical validation is assigned to V1.4.1 and is not claimed here.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - contracts/platform-integrations.json
    notes: Catalog and lifecycle coordination boundaries are documented, but canonical Mesh registration, capability publication, event transport, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - contracts/platform-integrations.json
      - app/src/main/java/com/goreecloud/appstore/identity/IdentityGateway.kt
      - web/entitlements.mjs
    notes: Development-only Identity fixtures exist, but production GoreeCloud Identity authentication, session, authorization, account-disablement, revocation, and server-authoritative entitled-catalog delivery are not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and accept the App Store-owned backup scope for catalog configuration, per-identity library/history state, release metadata, and other durable state that requires recovery.
      - Preserve Privacy Shield minimization and retention requirements while keeping synchronization distinct from backup truth.
  restore:
    required: true
    requirements:
      - Validate restoration into clean supported Android and Linux environments and define recovery behavior for any durable Web-owned state before recoverability is claimed.
      - Define account-scoped reconciliation, package-state reconciliation, rollback, and failure semantics before Library recovery is production-enabled.
  export:
    required: true
    requirements:
      - Provide a documented user-controlled export for portable App Store-owned library/history state where applicable.
      - Exclude credentials, protected catalog metadata, and unrelated platform-owned state unless separately authorized.
  portability:
    required: true
    requirements:
      - Keep durable App Store-owned state in documented versioned formats or contracts that can be migrated without binding recovery to one client implementation.
      - Define migration behavior for catalog schema, per-identity library/history state, and release-channel metadata before Stable qualification.

external_dependencies:
  - name: Android platform
    purpose: Native application runtime, package inventory, user-authorized package installation interfaces, accessibility services, and application execution environment.
    required: true
    version_constraint: ">=26"
  - name: Linux desktop platform
    purpose: Native GTK 4 and libadwaita client runtime plus Debian and Flatpak Development packaging and desktop integration.
    required: true
    version_constraint: "GTK 4 + libadwaita 1"
  - name: Web platform
    purpose: Standards-based browser runtime for the first-party Web Development client; production hosting and server-authoritative entitlement delivery remain separate acceptance requirements.
    required: true
    version_constraint: "modern standards browser"

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "1.4.0"
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.4.0
    - android-api>=26
    - linux-native-client
    - web-static-client
  provides:
    - goreecloud-app-store-development-catalog/2

